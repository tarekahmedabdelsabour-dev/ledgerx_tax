[project]
name = "ledgerx_tax"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Electronic invoicing and tax authority connections: Egypt ETA, Saudi ZATCA, UAE Peppol, and any other system through a configurable connector"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"
